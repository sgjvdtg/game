<!DOCTYPE html>
<html>
<head>
  <title>ICE Defense: Minneapolis</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://code.jquery.com/jquery-1.12.1.min.js"></script>
  <script src="gamelab-api.js"></script>
  <link href="gamelab.css" rel="stylesheet" type="text/css">
  
  <script src="p5.js"></script>
  <script src="p5.play.js"></script>
  <script src="code.js"></script>

  <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    /* FIX: Force the invisible wrapper div to expand so the game doesn't get squished */
    #sketch {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    canvas {
        width: 100% !important;
        height: 100% !important;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain; 
    }

    /* Hide mobile controls but keep them available so the engine doesn't crash */
    #soft-buttons,
    #studio-dpad-container {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="sketch"></div>

  <div id="soft-buttons">
    <button id="leftButton" disabled></button>
    <button id="rightButton" disabled></button>
    <button id="upButton" disabled></button>
    <button id="downButton" disabled></button>
  </div>
  <div id="studio-dpad-container"></div>

</body>
</html>
